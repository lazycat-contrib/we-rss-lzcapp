application:
  subdomain: we-rss
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://we-rss:8001/
services:
  we-rss:
    # upstream: ghcr.io/rachelos/we-mp-rss:latest@sha256:125472e8a58a05f02b930ba2b958575ffc87378743d9491383b13390f709215e
    image: registry.lazycat.cloud/czyt/rachelos/we-mp-rss:fdf5fed7ab618f6a
    environment:
      - DB=sqlite:///data/db.db
      - USERNAME={{.U.auth_user}}
      - PASSWORD={{.U.auth_pass}}
    binds:
      - /lzcapp/var/data:/app/data
